name: Cloudflare Zone Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest

    steps:
      - name: List Cloudflare zones
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_EMAIL:-}" ]]; then
            echo "CLOUDFLARE_EMAIL is missing."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_API_KEY:-}" ]]; then
            echo "CLOUDFLARE_API_KEY is missing."
            exit 1
          fi

          response="$(curl --fail --silent --show-error             --request GET             --url "https://api.cloudflare.com/client/v4/zones?per_page=100"             --header "X-Auth-Email: ${CLOUDFLARE_EMAIL}"             --header "X-Auth-Key: ${CLOUDFLARE_API_KEY}"             --header "Content-Type: application/json")"

          RESPONSE="$response" python3 -c 'import json,os; d=json.loads(os.environ["RESPONSE"]); assert d.get("success") is True; [print("ZONE",z.get("name"),z.get("id"),z.get("status")) for z in d.get("result",[])]'
