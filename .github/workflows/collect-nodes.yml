name: Collect free public nodes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "collector/**"
      - ".github/workflows/collect-nodes.yml"

permissions:
  contents: write

concurrency:
  group: public-node-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect and validate public VLESS nodes
        run: python3 collector/collect.py

      - name: Publish directory
        shell: bash
        run: |
          set -euo pipefail
          test -s directory/nodes.json

          candidate="$RUNNER_TEMP/jamshidix-nodes.json"
          cp directory/nodes.json "$candidate"

          git config user.name "jamshidix-bot"
          git config user.email "jamshidix-bot@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard origin/main

            if test -s directory/nodes.json; then
              current_ts="$(python3 -c 'import json; print(json.load(open("directory/nodes.json", encoding="utf-8")).get("generated_at", ""))')"
              candidate_ts="$(python3 - "$candidate" <<'PY'
import json, sys
with open(sys.argv[1], encoding="utf-8") as f:
    print(json.load(f).get("generated_at", ""))
PY
)"
              if [ -n "$current_ts" ] && [ -n "$candidate_ts" ] && [ "$current_ts" > "$candidate_ts" ]; then
                echo "A newer directory is already published."
                exit 0
              fi
            fi

            cp "$candidate" directory/nodes.json
            git add directory/nodes.json

            if git diff --cached --quiet; then
              echo "Directory unchanged."
              exit 0
            fi

            git commit -m "chore: refresh public free node directory"

            if git push origin HEAD:main; then
              echo "Directory published."
              exit 0
            fi

            echo "Concurrent main update detected; retrying."
          done

          echo "Unable to publish directory after retries." >&2
          exit 1
