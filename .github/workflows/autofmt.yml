name: Auto-format Go

on:
  push:
    paths:
      - "**/*.go"

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: gofmt with diagnostics
        shell: bash
        run: |
          set +e
          rm -f gofmt-error.log
          status=0
          while IFS= read -r -d '' f; do
            if ! gofmt -w "$f" 2>>gofmt-error.log; then
              echo "gofmt failed: $f" >&2
              status=1
            fi
          done < <(find cmd/jamshidix -name '*.go' -print0)
          if [ -s gofmt-error.log ]; then
            cat gofmt-error.log >&2
          fi
          exit $status
      - name: Preserve formatter diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "jamshidix-bot"
          git config user.email "jamshidix-bot@users.noreply.github.com"
          git add cmd/jamshidix gofmt-error.log
          git diff --cached --quiet && exit 0
          git commit -m "chore: format Go sources and record diagnostics"
          git push
