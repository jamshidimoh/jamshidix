name: Auto-format Go

on:
  push:
    paths:
      - "**/*.go"

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: gofmt
        run: gofmt -w cmd/jamshidix
      - name: Commit formatting changes
        shell: bash
        run: |
          git config user.name "jamshidix-bot"
          git config user.email "jamshidix-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git add cmd/jamshidix
          git commit -m "style: gofmt"
          git push
