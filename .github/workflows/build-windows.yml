name: Build Windows executable

# Produces ONE self-contained Jamshidix.exe (official sing-box embedded,
# SHA-256 pinned). A successful main build creates the stable Release defined by VERSION if absent.
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "cmd/jamshidix/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: jamshidix-build-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != VERSION file" >&2; exit 1; }

      - name: Version consistency
        shell: bash
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "$(sed -n 's/.*appVersion[[:space:]]*= *"\([^"]*\)".*/\1/p' cmd/jamshidix/singbox.go)" || {
            echo "VERSION and appVersion differ." >&2
            exit 1
          }

      - name: Test
        shell: bash
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Prepare embedded emergency directory seed
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          src = Path("directory/nodes.json")
          dst = Path("cmd/jamshidix/assets/directory.seed.json")
          seed = {"version": 1, "generated_at": "", "nodes": [], "sources": []}
          if src.exists():
              data = json.loads(src.read_text(encoding="utf-8"))
              seed = {
                  "version": data.get("version", 1),
                  "generated_at": data.get("generated_at", ""),
                  "nodes": data.get("nodes", [])[:30],
                  "sources": data.get("sources", []),
              }
          dst.write_text(json.dumps(seed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"embedded seed nodes: {len(seed['nodes'])}")
          PY

      - name: Fetch pinned official sing-box archive
        shell: bash
        run: |
          VER="$(grep -oP 'singBoxVersion\s*=\s*"\K[^"]+' cmd/jamshidix/singbox.go)"
          SHA="$(grep -oP 'singBoxSHA256\s*=\s*"\K[0-9a-f]{64}' cmd/jamshidix/singbox.go)"
          curl --fail --silent --show-error --location \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-windows-amd64.zip" \
            -o cmd/jamshidix/assets/sing-box-windows-amd64.zip
          echo "${SHA}  cmd/jamshidix/assets/sing-box-windows-amd64.zip" | sha256sum --check

      - name: Build self-contained executable
        shell: bash
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet -tags embedsb ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags embedsb -trimpath \
            -ldflags="-s -w -H=windowsgui" -o dist/Jamshidix.exe ./cmd/jamshidix
          (cd dist && sha256sum Jamshidix.exe | tee Jamshidix.exe.sha256)

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Jamshidix-Windows-x64
          path: |
            dist/Jamshidix.exe
            dist/Jamshidix.exe.sha256
          if-no-files-found: error

      - name: Publish stable GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_TAG="v$(tr -d '[:space:]' < VERSION)"
          git fetch --no-tags origin main
          if ! git diff --quiet HEAD origin/main -- cmd/jamshidix config go.mod go.sum VERSION; then
            echo "Runtime source changed after this build started; refusing stale release." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; refreshing assets."
            gh release upload "$RELEASE_TAG" dist/Jamshidix.exe dist/Jamshidix.exe.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/Jamshidix.exe dist/Jamshidix.exe.sha256 \
              --title "Jamshidix ${RELEASE_TAG#v}" \
              --notes "Self-contained Windows GUI client with free public server directory, local preflight, region filtering and priority/speed sorting." \
              --latest
          fi
