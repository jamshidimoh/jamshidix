name: Go diagnostic

on:
  push:
    paths:
      - "cmd/jamshidix/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Collect diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "=== gofmt ==="
            gofmt -l cmd/jamshidix
            echo "=== go vet linux ==="
            go vet ./...
            echo "=== go vet windows ==="
            GOOS=windows GOARCH=amd64 go vet ./...
            echo "=== go build windows ==="
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags embedsb ./cmd/jamshidix
            echo "=== go test ==="
            go test ./... -count=1
          } > go-diagnostics.txt 2>&1
          cat go-diagnostics.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-diagnostics
          path: go-diagnostics.txt
