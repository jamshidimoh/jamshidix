name: Cloudflare Connection Test (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify scoped API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash ./scripts/cloudflare_connection_test.sh
