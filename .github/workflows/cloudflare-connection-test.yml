name: Cloudflare Connection Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest

    steps:
      - name: Test Cloudflare API
        shell: bash
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_EMAIL:-}" ]]; then
            echo "CLOUDFLARE_EMAIL is missing."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_API_KEY:-}" ]]; then
            echo "CLOUDFLARE_API_KEY is missing."
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --request GET \
            --url "https://api.cloudflare.com/client/v4/user" \
            --header "X-Auth-Email: ${CLOUDFLARE_EMAIL}" \
            --header "X-Auth-Key: ${CLOUDFLARE_API_KEY}" \
            --header "Content-Type: application/json")"

          if python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("success") is True else 1)' <<< "$response"; then
            echo "Cloudflare authentication succeeded."
          else
            echo "Cloudflare authentication failed."
            exit 1
          fi
