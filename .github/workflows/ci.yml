name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path("config").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("JSON OK:", path)
          PY

      - name: Shell syntax
        shell: bash
        run: |
          bash -n server/install_ubuntu.sh
          bash -n server/generate_server_config.sh
          bash -n scripts/generate_ids.sh
          bash -n scripts/secret_audit.sh
          bash -n scripts/validate_singbox.sh

      - name: ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck server/install_ubuntu.sh
          shellcheck server/generate_server_config.sh
          shellcheck scripts/generate_ids.sh
          shellcheck scripts/secret_audit.sh
          shellcheck scripts/validate_singbox.sh

      - name: PowerShell parse
        shell: pwsh
        run: |
          $files = Get-ChildItem client/windows/*.ps1
          foreach ($p in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $p.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "$($p.Name) has PowerShell parse errors."
            }
            Write-Host "PowerShell OK: $($p.Name)"
          }

      - name: Secret audit
        shell: bash
        run: bash ./scripts/secret_audit.sh

      - name: sing-box parser validation
        shell: bash
        run: bash ./scripts/validate_singbox.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format
        shell: bash
        run: terraform fmt -check -recursive infra/oci

      - name: Terraform validation
        shell: bash
        working-directory: infra/oci
        run: |
          terraform init -backend=false -input=false
          terraform validate
