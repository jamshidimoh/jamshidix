name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path("config").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("JSON OK:", path)
          PY

      - name: Shell syntax
        shell: bash
        run: |
          bash -n server/install_ubuntu.sh
          bash -n server/generate_server_config.sh
          bash -n scripts/generate_ids.sh
          bash -n scripts/secret_audit.sh
          bash -n scripts/validate_singbox.sh

      - name: ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck server/install_ubuntu.sh
          shellcheck server/generate_server_config.sh
          shellcheck scripts/generate_ids.sh
          shellcheck scripts/secret_audit.sh
          shellcheck scripts/validate_singbox.sh

      - name: PowerShell parse
        shell: pwsh
        run: |
          $files = Get-ChildItem client/windows/*.ps1
          foreach ($p in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $p.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "$($p.Name) has PowerShell parse errors."
            }
            Write-Host "PowerShell OK: $($p.Name)"
          }

      - name: Secret audit
        shell: bash
        run: bash ./scripts/secret_audit.sh

      - name: sing-box parser validation
        shell: bash
        run: bash ./scripts/validate_singbox.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Go format check
        shell: bash
        run: |
          test -z "$(gofmt -l cmd/jamshidix)"

      - name: Go test and vet
        shell: bash
        run: |
          go test ./...
          go vet ./...

      - name: Build Windows executable
        shell: bash
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/Jamshidix.exe ./cmd/jamshidix
          file dist/Jamshidix.exe
          sha256sum dist/Jamshidix.exe

      - name: Upload Windows one-click executable
        uses: actions/upload-artifact@v4
        with:
          name: Jamshidix-Windows-x64-OneClick
          path: dist/Jamshidix.exe
          if-no-files-found: error

      - name: Terraform format
        shell: bash
        run: terraform fmt -check -recursive infra/oci

      - name: Terraform validation
        shell: bash
        working-directory: infra/oci
        run: |
          terraform init -backend=false -input=false
          terraform validate
