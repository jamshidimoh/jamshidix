name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Validate JSON syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in list(Path("config").rglob("*.json")) + list(Path("cmd").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print("JSON OK:", path)
          PY

      - name: Shell syntax and ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          for f in server/*.sh scripts/*.sh; do
            bash -n "$f"
            shellcheck "$f"
          done

      - name: PowerShell parse
        shell: pwsh
        run: |
          $files = Get-ChildItem client/windows/*.ps1
          foreach ($p in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $p.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "$($p.Name) has PowerShell parse errors."
            }
            Write-Host "PowerShell OK: $($p.Name)"
          }

      - name: Secret audit
        shell: bash
        run: bash ./scripts/secret_audit.sh

      - name: Go format, vet (Linux + Windows) and unit tests
        shell: bash
        run: |
          test -z "$(gofmt -l cmd/jamshidix)"
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./... -count=1

      - name: sing-box parser validation (templates + rendered client config)
        shell: bash
        run: bash ./scripts/validate_singbox.sh

      - name: Build Windows executable (download-on-first-run variant)
        shell: bash
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/Jamshidix-lite.exe ./cmd/jamshidix
          file dist/Jamshidix-lite.exe
          sha256sum dist/Jamshidix-lite.exe

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format and validation
        shell: bash
        run: |
          terraform fmt -check -recursive infra/oci
          cd infra/oci
          terraform init -backend=false -input=false
          terraform validate
