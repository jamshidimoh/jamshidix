name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON templates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for p in Path("config").glob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("OK", p)
          PY

      - name: Shell syntax
        shell: bash
        run: |
          bash -n server/install_ubuntu.sh
          bash -n server/generate_server_config.sh
          bash -n scripts/generate_ids.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($p in Get-ChildItem client/windows/*.ps1) {
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $p.FullName,
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) { throw "$($p.Name) has PowerShell parse errors." }
            Write-Host "OK $($p.Name)"
          }
